[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-mcp-server"
version = "0.1.0"
description = "MCP server exposing mock customer lookup and refund tools over STDIO."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.9",
    "mcp>=2.3,<3",
    "pydantic>=2.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
customer-mcp-server = "customer_mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["customer_mcp_server"]
branch = true
# Also measure the server subprocesses launched by the STDIO tests.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# SIM300 misreads the mutable PROCESSED_REFUNDS list as a constant.
ignore = ["SIM300"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
