[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-security-gateway"
version = "0.1.0"
description = "HTTP reverse proxy for MCP that authenticates Bearer tokens and blocks admin_* tool calls for non-admin roles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The mock downstream server and the end-to-end tests use the official MCP SDK.
mock = ["mcp>=2.3,<3"]
dev = [
    "mcp>=2.3,<3",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
mcp-gateway = "mcp_gateway.__main__:main"
mcp-gateway-token = "mcp_gateway.tokens:main"
mcp-gateway-mock-server = "mcp_gateway.mock_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["mcp_gateway"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
